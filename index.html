<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>indiana_signature_files</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; }
    .item { border: 1px solid #ddd; padding: 10px; text-align: center; }
    .item img { max-width: 100%; max-height: 120px; }
    .item a { display: block; margin-top: 8px; font-size: 13px; word-break: break-all; }
  </style>
</head>
<body>
  <h1>Signature files</h1>
  <div class="grid">
  {% for file in site.static_files %}
    {% assign href = file.path | remove_first: "/" | uri_escape %}
    <div class="item">
      {% if file.extname == ".png" or file.extname == ".jpg" or file.extname == ".gif" %}
        <img src="{{ href }}" alt="{{ file.name }}">
      {% endif %}
      <a href="{{ href }}">{{ file.name }}</a>
    </div>
  {% endfor %}
  </div>
</body>
</html>
